# Dev stack: postgres (with pgvector, for the Phase 2 memory layer) + backend + frontend
# with live reload, identical across OS. Recommended path on Windows. See RUNNING.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      # Keep the image's deps from being shadowed by the bind mount above.
      - backend-venv:/app/.venv
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # The Next proxy targets the backend service on the compose network.
      - BACKEND_ORIGIN=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-venv:
  frontend-node-modules:
  frontend-next:
