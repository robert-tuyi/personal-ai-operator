[project]
name = "personal-ai-operator-backend"
version = "0.1.0"
description = "Personal AI Operator — FastAPI backend"
requires-python = ">=3.11"

# Runtime dependencies — what the app needs to run in production.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "authlib>=1.3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "itsdangerous>=2.2",
]

# Dev-only tooling — installed locally by `uv sync`, not in production.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
